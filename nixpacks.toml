# Fallback configuration for Nixpacks builder
[phases.setup]
nixPkgs = ["php83", "php83Packages.composer", "nodejs_22", "corepack"]

[phases.install]
cmds = [
    "composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader",
    "corepack enable",
    "corepack prepare pnpm@12.6.0 --activate",
    "pnpm install --frozen-lockfile"
]

[phases.build]
cmds = [
    "pnpm run build"
]

[start]
cmd = "sh docker/entrypoint.sh"

[variables]
NODE_ENV = "production"
NIXPACKS_PHP_ROOT_DIR = "public"
